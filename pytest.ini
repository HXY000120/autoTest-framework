[pytest]
# 根目录加入 sys.path，支持 `from common.xxx / base.xxx / page.xxx` 绝对导入
pythonpath = .
# 只收集用例层，page/ 与 base/ 不作为用例被发现
testpaths = script
markers =
    api: 接口自动化用例（技术维度）
    web: Web UI 自动化用例（技术维度）
    app: App UI 自动化用例（技术维度）
    mp: 自媒体业务端（接口+Web，业务维度，可由 TEST_TARGET=mp 收集隔离）
    mis: 后台审核业务端（接口+Web，业务维度）
    app_end: 用户端 App 业务端（业务维度；与 app 技术维度区分，避免 -m app 混淆）
    mock: 虚拟接口(Mock Server)用例，不依赖外部环境，CI 可稳定执行
addopts = -ra
