# mp 发布文章页 - 表单校验判定表用例（真实浏览器执行）
# 不真正提交数据：表单校验不通过时前端会拦截，接口也不会被调用
- case_id: MP_UI_PUB_01
  desc: 全空提交，应同时报出多项必填校验
  method: 判定表
  title: ""
  expect_errors:
    - 文章标题不能小于4个字符
    - 内容标签不能为空
    - 请选择频道
  expect_no_errors: []

- case_id: MP_UI_PUB_02
  desc: 标题长度下界-1（3 字符）
  method: 边界值
  title: abc
  expect_errors:
    - 文章标题不能小于4个字符
  expect_no_errors: []

- case_id: MP_UI_PUB_03
  desc: 标题长度下界（合法长度），标题校验应消失
  method: 边界值
  title: 自动化测试文章
  expect_errors:
    - 内容标签不能为空
  expect_no_errors:
    - 文章标题不能小于4个字符
