# mis 后台登录 - 异常/边界参数用例（等价类 + 边界值 + 判定表）
- case_id: MIS_LOGIN_N01
  desc: 错误密码（无效等价类）
  method: 等价类-无效
  payload: {name: demo, password: wrong_password_123}

- case_id: MIS_LOGIN_N02
  desc: 用户不存在
  method: 等价类-无效
  payload: {name: no_such_admin_zzz, password: wrong_password_123}

- case_id: MIS_LOGIN_N03
  desc: 用户名为空串
  method: 边界值
  payload: {name: "", password: wrong_password_123}

- case_id: MIS_LOGIN_N04
  desc: 密码为空串
  method: 边界值
  payload: {name: demo, password: ""}

- case_id: MIS_LOGIN_N05
  desc: 缺少 name 字段
  method: 判定表
  payload: {password: wrong_password_123}

- case_id: MIS_LOGIN_N06
  desc: 缺少 password 字段
  method: 判定表
  payload: {name: demo}

- case_id: MIS_LOGIN_N07
  desc: 空请求体
  method: 判定表
  payload: {}

- case_id: MIS_LOGIN_N08
  desc: SQL 注入样式用户名
  method: 安全性
  payload: {name: "admin' OR '1'='1", password: wrong_password_123}

- case_id: MIS_LOGIN_N09
  desc: 用户名为纯空格
  method: 边界值
  payload: {name: "   ", password: wrong_password_123}

- case_id: MIS_LOGIN_N10
  desc: 密码超长
  method: 边界值
  payload: {name: demo, password: "dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"}
