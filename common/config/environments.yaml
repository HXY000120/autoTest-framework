# 今日资讯平台测试项目 - 多环境配置
#
# 设计原则：框架不绑定任何具体站点，仓库里不保存真实地址与账号。
#   - 默认 base_url 为空，pytest 全部走本地虚拟接口（Mock Server），不联网
#   - 需要联调真实被测系统时，通过环境变量注入（见 README「被测环境配置」）：
#       MP_BASE_URL / MIS_BASE_URL / APP_BASE_URL
#       MP_API_PREFIX / MIS_API_PREFIX
#       MP_USERNAME / MP_PASSWORD / MIS_USERNAME / MIS_PASSWORD
#   - 环境变量也可写在 .env（已被 .gitignore 忽略）
#
# 结构说明：
#   endpoints.<端名>.base_url      该端域名（不含路径），由环境变量注入
#   endpoints.<端名>.api_prefix   网关前缀，请求时自动拼在接口路径前
#   credentials.<端名>            登录账号；password_pattern 中的 {date}
#                                 会在运行时替换为当天日期（YYYYMMDD）
default: test

environments:
  dev:
    endpoints:
      mp:
        base_url: ""
        api_prefix: /wemedia/MEDIA
      mis:
        base_url: ""
        api_prefix: /service_6001
      app:
        base_url: ""
        api_prefix: ""
        # APP 端接口路径占位；接入真实服务后同时填 base_url 与 login_path
        login_path: /app/v1_0/authorizations
    credentials:
      mp:
        username: ""
        password_pattern: ""
      mis:
        username: ""
        password_pattern: ""
    headers:
      Content-Type: application/json
    appium_server: http://127.0.0.1:4723/wd/hub
    app_caps:
      platformName: Android
      platformVersion: "12"
      deviceName: emulator
      # 网易新闻（APP 端被测对象，暂定）。activity 以真机/模拟器
      # `adb shell dumpsys window | findstr mCurrentFocus` 实际值为准
      appPackage: com.netease.newsreader.activity
      appActivity: .nr.phone.main.MainActivity
      automationName: UiAutomator2

  test:
    # 默认环境：不配置任何外部地址，离线即可完整复现
    endpoints:
      mp:
        base_url: ""
        api_prefix: /wemedia/MEDIA
      mis:
        base_url: ""
        api_prefix: /service_6001
      app:
        # APP 端被测对象为网易新闻 App，无自有接口域名（接口由 Mock Server 补齐）
        base_url: ""
        api_prefix: ""
        login_path: /app/v1_0/authorizations
    credentials:
      mp:
        username: ""
        password_pattern: ""
      mis:
        username: ""
        password_pattern: ""
    headers:
      Content-Type: application/json
    appium_server: http://127.0.0.1:4723/wd/hub
    app_caps:
      platformName: Android
      platformVersion: "12"
      deviceName: emulator
      # 网易新闻包名（以真机/模拟器实际为准）
      appPackage: com.netease.newsreader.activity
      appActivity: .nr.phone.main.MainActivity
      automationName: UiAutomator2

  prod:
    endpoints:
      mp:
        base_url: ""
        api_prefix: /wemedia/MEDIA
      mis:
        base_url: ""
        api_prefix: /service_6001
      app:
        base_url: ""
        api_prefix: ""
        login_path: /app/v1_0/authorizations
    credentials:
      mp:
        username: ""
        password_pattern: ""
      mis:
        username: ""
        password_pattern: ""
    headers:
      Content-Type: application/json
    appium_server: http://127.0.0.1:4723/wd/hub
    app_caps:
      platformName: Android
      platformVersion: "12"
      deviceName: emulator
      appPackage: com.netease.newsreader.activity
      appActivity: .nr.phone.main.MainActivity
      automationName: UiAutomator2
